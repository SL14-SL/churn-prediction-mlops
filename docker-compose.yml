services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mlflowdb
    ports:
      - "5432:5432"
    networks:
      - mlops-net
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    user: "${UID}:${GID}"
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://postgres:postgres@db:5432/mlflowdb
      MLFLOW_ARTIFACT_ROOT: /app/mlruns
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow:5000,localhost:5000,127.0.0.1:5000
    volumes:
      - ./mlruns:/app/mlruns
    networks:
      - mlops-net
    depends_on:
      db:
        condition: service_healthy

  prefect:
    image: prefecthq/prefect:3.7.2-python3.12
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@db:5432/prefectdb
    volumes:
      - ./prefect_data:/root/.prefect
    command: prefect server start
    networks:
      - mlops-net
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    user: "${UID}:${GID}"
    ports:
      - "8000:8080"
      - "8501:8501"
    environment:
      PYTHONPATH: /app
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_HOME: /tmp/prefect
      PREFECT_PROFILE: ephemeral
      MPLCONFIGDIR: /tmp/matplotlib
      UV_CACHE_DIR: /tmp/.uv_cache
      PYTHONPYCACHEPREFIX: /tmp/pycache
      UV_NO_SYNC: "1"
      API_KEY: ${API_KEY}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-local}
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./flows:/app/flows
      - ./mlruns:/app/mlruns
      - ./data:/app/data
      - ./models:/app/models
      - ./scripts:/app/scripts
    networks:
      - mlops-net
    depends_on:
      mlflow:
        condition: service_started
      prefect:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: churn-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - alertmanager
    networks:
      - mlops-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: churn-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - mlops-net
    restart: unless-stopped

  alert-receiver:
    build: .
    user: "${UID}:${GID}"
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - src.monitoring.alert_receiver:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    environment:
      PYTHONPATH: /app
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      UV_NO_SYNC: "1"
      UV_CACHE_DIR: /tmp/.uv_cache
      PYTHONPYCACHEPREFIX: /tmp/pycache
    volumes:
      - ./src:/app/src
    networks:
      - mlops-net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8090/livez',
          timeout=3
          )
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: churn-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - mlops-net
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/provisioned-dashboards:ro

networks:
  mlops-net:
    driver: bridge

volumes:
  alertmanager-data:
  grafana-data: