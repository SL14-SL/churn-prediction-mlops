global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: churn-api-prod
    scheme: https
    metrics_path: /metrics

    static_configs:
      - targets:
          - churn-prediction-api-5l2tmfys6q-ew.a.run.app:443

        labels:
          environment: prod
          platform: cloud-run
          service: churn-api