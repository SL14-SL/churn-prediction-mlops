global:
  resolve_timeout: 5m

route:
  receiver: local-observer
  group_by:
    - alertname
    - service
    - severity
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - receiver: critical-observer
      matchers:
        - severity="critical"
      group_wait: 0s
      repeat_interval: 1h

    - receiver: warning-observer
      matchers:
        - severity="warning"
      group_wait: 30s
      repeat_interval: 4h

receivers:
  - name: local-observer

  - name: critical-observer
    webhook_configs:
      - url: http://alert-receiver:8090/alerts
        send_resolved: true

  - name: warning-observer
    webhook_configs:
      - url: http://alert-receiver:8090/alerts
        send_resolved: true