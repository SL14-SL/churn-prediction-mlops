global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "churn-api-local"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "api:8080"
        labels:
          environment: "local"

  - job_name: "churn-api-prod"
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - "churn-prediction-api-5l2tmfys6q-ew.a.run.app"
        labels:
          environment: "prod"